name: Verify viewer
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - README.md
      - LICENSE
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 -m py_compile backend/*.py
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-screenshots
          path: artifacts/visual-feedback/after/
